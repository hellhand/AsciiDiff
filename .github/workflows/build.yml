name: Build Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            glibc: "2.35"
            suffix: "glibc2.35"
          - os: ubuntu-24.04
            glibc: "2.39"
            suffix: "glibc2.39"
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: Build AppImage
        run: npx tauri build --bundles appimage
        working-directory: frontend
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"

      - name: Rename AppImage with glibc version
        run: |
          cd frontend/src-tauri/target/release/bundle/appimage
          for f in *.AppImage; do
            mv "$f" "${f%.AppImage}-${{ matrix.suffix }}.AppImage"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage-${{ matrix.suffix }}
          path: frontend/src-tauri/target/release/bundle/appimage/*.AppImage

  build-container:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container image
        run: |
          docker build -f Dockerfile.run -t asciidiff:latest .
          docker save asciidiff:latest | gzip > asciidiff-container.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: linux-container
          path: asciidiff-container.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: Build Windows bundles
        run: npx tauri build --bundles nsis,msi
        working-directory: frontend
        env:
          CARGO_NET_RETRY: "10"
          CARGO_HTTP_CHECK_REVOKE: "false"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            frontend/src-tauri/target/release/bundle/msi/*.msi
            frontend/src-tauri/target/release/bundle/nsis/*.exe
            frontend/src-tauri/target/release/asciidiff.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: Build DMG
        run: npx tauri build --bundles dmg
        working-directory: frontend

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: frontend/src-tauri/target/release/bundle/dmg/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-container, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/linux-appimage-*/*.AppImage
            artifacts/linux-container/*.tar.gz
            artifacts/windows-installers/**/*.msi
            artifacts/windows-installers/**/*.exe
            artifacts/macos-dmg/*.dmg
